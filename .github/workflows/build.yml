name: Rebuild KEV dump

on:
  # Vektor's EPSS sync runs by 21:17 UTC; KEV entries reach Vektor within minutes of CISA's release.
  schedule:
    - cron: '43 22 * * *'
  workflow_dispatch:

concurrency:
  group: kev-dump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Public inputs only (CISA KEV feed, Vektor POST /api/triage, 4 calls); no secrets.
      - name: Build data/kev.json, data/kev.csv and the README snapshot
        run: node scripts/build.mjs
      - name: Commit when anything changed
        run: |
          git add data/kev.json data/kev.csv README.md
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "KEV dump $(date -u +%Y-%m-%d)"
          git push
